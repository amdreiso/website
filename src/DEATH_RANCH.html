<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="../css/style.css">
		<title>DEATH_RANCH</title>
	</head>

	<body>
		<header class="title">
			<h1>DEATH_RANCH</h1>
		</header>

		<div id="content"></div>

		<script>
			function parseVimwiki(text) {
				return text
					// headings = Title =
					.replace(/^= (.*?) =$/gm, "<h1>$1</h1>")
					.replace(/^== (.*?) ==$/gm, "<h2>$1</h2>")

					// bold / italic
					.replace(/\*(.*?)\*/g, "<b>$1</b>")
					.replace(/_(.*?)_/g, "<i>$1</i>")

					// links [[text]]
					.replace(/\[\[(.*?)\]\]/g, "<a href='#'>$1</a>")

					// line breaks
					//.replace(/\n/g, "<br>");
			}

		fetch("https://raw.githubusercontent.com/amdreiso/todo/refs/heads/main/death_ranch.wiki")
			.then(res => res.text())
			.then(text => {
				document.getElementById("content").innerHTML = parseVimwiki(text);
			});
		</script>
	</body>
</html>
